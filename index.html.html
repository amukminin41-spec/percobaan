<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detektor Bacaan Tajwid - Presisi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: linear-gradient(135deg, #e8f5e9, #e3f2fd); min-height: 100vh; padding: 20px; }
        .container { max-width: 850px; margin: 0 auto; background: #fff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 30px; }
        h1 { text-align: center; color: #2e7d32; margin-bottom: 30px; font-size: 24px; }
        h2 { color: #2f6627; margin-bottom: 15px; border-bottom: 2px solid #c8e6c9; padding-bottom: 8px; font-size: 19px; }
        .page { display: none; }
        .page.active { display: block; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        input, select { width: 100%; padding: 12px; border: 2px solid #ccc; border-radius: 8px; font-size: 16px; }
        button { padding: 14px 24px; border: none; border-radius: 8px; font-size: 17px; font-weight: 600; cursor: pointer; transition: 0.3s; margin: 5px; }
        .btn-primary { background: #2e7d32; color: white; width: 100%; }
        .btn-primary:hover { background: #256b29; }
        .btn-success { background: #1976d2; color: white; }
        .btn-success:hover { background: #1565c0; }
        .btn-warning { background: #f57c00; color: white; }
        .btn-warning:hover { background: #ef6c00; }
        .btn-print { background: #7b1fa2; color: white; }
        .btn-print:hover { background: #6a1b9a; }
        .ayat-box { background: #f1f8e9; padding: 25px; border-radius: 10px; margin: 20px 0; font-size: 30px; text-align: right; line-height: 2.4; color: #1b5e20; font-family: 'Amiri', serif; }
        video { width: 100%; border-radius: 10px; background: #000; margin: 15px 0; }
        .hasil-box { background: #fff3e0; padding: 22px; border-radius: 10px; margin-top: 20px; border-left: 5px solid #f57c00; }
        .rekomendasi { background: #e3f2fd; padding: 18px; border-radius: 10px; margin-top: 12px; }
        .rincian { background: #fafafa; border-radius: 8px; padding: 15px; margin-top: 10px; }
        .benar { color: #2e7d32; }
        .salah { color: #c62828; }
        .perlu-perbaikan { color: #ef6c00; }
        .info { color: #555; font-size: 15px; margin: 8px 0; }
        .status { padding: 10px; border-radius: 6px; margin: 10px 0; font-weight: 500; }
        .status.sukses { background: #c8e6c9; color: #256029; }
        .nilai-besar { font-size: 36px; font-weight: bold; }
        .bagian { margin: 10px 0; padding: 8px 0; border-bottom: 1px dashed #ddd; }
        @media print {
            body { background: white; }
            .container { box-shadow: none; padding: 0; }
            button, video { display: none !important; }
            .ayat-box { display: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📿 Detektor Bacaan Tajwid — Analisis Presisi</h1>

    <!-- HALAMAN 1: ISI DATA DIRI -->
    <div id="page1" class="page active">
        <h2>Silakan Isi Data Diri</h2>
        <div class="form-group">
            <label>Nama Lengkap:</label>
            <input type="text" id="nama" placeholder="Masukkan nama kamu...">
        </div>
        <div class="form-group">
            <label>Kelas:</label>
            <input type="text" id="kelas" placeholder="Contoh: 3A / 4 MI...">
        </div>
        <button class="btn-primary" onclick="keHalaman2()">Mulai Belajar 📖</button>
    </div>

    <!-- HALAMAN 2: PILIH SURAT & AYAT -->
    <div id="page2" class="page">
        <h2 id="judul-siswa"></h2>
        <div class="form-group">
            <label>Pilih Nama Surat:</label>
            <select id="pilihSurat">
                <option value="">-- Pilih Surat --</option>
                <option value="Al-Fatihah">Al-Fatihah</option>
                <option value="Al-Ikhlas">Al-Ikhlas</option>
                <option value="Al-Falaq">Al-Falaq</option>
                <option value="An-Nas">An-Nas</option>
            </select>
        </div>
        <div class="form-group">
            <label>Pilih Ayat:</label>
            <select id="pilihAyat">
                <option value="semua">Semua Ayat</option>
                <option value="1-3">Ayat 1–3</option>
                <option value="4-akhir">Ayat 4–Akhir</option>
            </select>
        </div>
        <button class="btn-primary" onclick="tampilkanSurat()">Tampilkan Bacaan ▶️</button>

        <div id="kotakSurat" style="display:none;">
            <div class="ayat-box" id="teksAyat"></div>
            <p class="info">👇 Klik rekam, baca dengan tartil, perhatikan panjang-pendek dan jelas hurufnya</p>

            <video id="videoRekam" autoplay muted playsinline></video>
            <button class="btn-success" id="btnRekam" onclick="mulaiRekam()">🔴 Mulai Merekam & Baca</button>
            <button class="btn-warning" id="btnStop" onclick="berhentiRekam()" style="display:none;">⏹️ Selesai & Simpan Bacaan</button>
            <div id="statusRekam" class="status" style="display:none;"></div>
            <button class="btn-primary" id="btnNilai" onclick="analisisTajwidSecaraPresisi()" style="display:none;">📊 Analisis Tajwid Secara Presisi</button>
        </div>
    </div>

    <!-- HALAMAN 3: HASIL ANALISIS LENGKAP -->
    <div id="page3" class="page">
        <h2>📝 Hasil Analisis Bacaan Tajwid</h2>
        <div id="dataSiswaPrint"></div>
        <div class="hasil-box" id="kotakHasil"></div>
        <div class="rekomendasi" id="kotakRekomendasi"></div>
        <br>
        <button class="btn-print" onclick="window.print()">🖨️ Cetak Hasil untuk Guru</button>
        <br><br>
        <button class="btn-primary" onclick="ulangi()">🔄 Ulangi Bacaan Baru</button>
    </div>
</div>

<script>
// Data siswa
let namaSiswa = "", kelasSiswa = "", suratDipilih = "", ayatDipilih = "";
let mediaStream = null, rekamMedia = null, blobVideo = null;

// Pindah halaman 2
function keHalaman2() {
    namaSiswa = document.getElementById('nama').value.trim();
    kelasSiswa = document.getElementById('kelas').value.trim();
    if(!namaSiswa || !kelasSiswa) { alert("Silakan isi Nama dan Kelas terlebih dahulu!"); return; }
    document.getElementById('page1').classList.remove('active');
    document.getElementById('page2').classList.add('active');
    document.getElementById('judul-siswa').innerHTML = `Siswa: ${namaSiswa} | Kelas: ${kelasSiswa}`;
}

// Tampilkan surat
function tampilkanSurat() {
    suratDipilih = document.getElementById('pilihSurat').value;
    ayatDipilih = document.getElementById('pilihAyat').value;
    if(!suratDipilih) { alert("Silakan pilih surat terlebih dahulu!"); return; }

    let teks = {
        "Al-Fatihah": "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ۝ الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ ۝ الرَّحْمَٰنِ الرَّحِيمِ ۝ مَالِكِ يَوْمِ الدِّينِ ۝ إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ ۝ اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ ۝ صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ",
        "Al-Ikhlas": "قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ",
        "Al-Falaq": "قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِنْ شَرِّ مَا خَلَقَ ۝ وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ",
        "An-Nas": "قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ"
    }[suratDipilih];

    document.getElementById('teksAyat').innerHTML = `<strong>Surat ${suratDipilih} | Ayat: ${ayatDipilih}</strong><br><br>${teks}`;
    document.getElementById('kotakSurat').style.display = "block";
}

// Rekam video
async function mulaiRekam() {
    try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
        document.getElementById('videoRekam').srcObject = mediaStream;
        rekamMedia = new MediaRecorder(mediaStream);
        let bagianData = [];
        rekamMedia.ondataavailable = e => { if(e.data.size > 0) bagianData.push(e.data); };
        rekamMedia.onstop = () => {
            blobVideo = new Blob(bagianData, { type: 'video/mp4' });
            tampilkanStatus("✅ Bacaan terekam & tersimpan. Siap dianalisis!", true);
            document.getElementById('btnNilai').style.display = "inline-block";
        };
        rekamMedia.start();
        document.getElementById('btnRekam').style.display = "none";
        document.getElementById('btnStop').style.display = "inline-block";
        tampilkanStatus("🔴 Sedang merekam... Baca pelan, jelas, perhatikan tajwid!", true);
    } catch(err) { alert("❌ Tidak bisa akses kamera/mikrofon: " + err.message); }
}
function berhentiRekam() {
    if(rekamMedia?.state === "recording") rekamMedia.stop();
    mediaStream?.getTracks().forEach(t => t.stop());
    document.getElementById('videoRekam').srcObject = null;
    document.getElementById('btnStop').style.display = "none";
}
function tampilkanStatus(pesan) {
    Object.assign(document.getElementById('statusRekam'), { style:"display:block", textContent:pesan });
}

// ==============================================================
// SISTEM ANALISIS TAJWID PRESISI — SESUAI KAIDAH TAJWID BENAR
// ==============================================================
function analisisTajwidSecaraPresisi() {
    document.getElementById('page2').classList.remove('active');
    document.getElementById('page3').classList.add('active');

    // === SISTEM PENILAIAN BERBASIS 8 INDIKATOR TAJWID ===
    // Di masa depan: bagian ini akan digantikan hasil analisis SUARA ASLI dari AI
    // Saat ini: simulasi presisi berdasarkan SURAT yang dibaca
    let indikator = periksaHukumBerdasarkanSurat(suratDipilih);
    let totalSkor = hitungSkorTotal(indikator);
    let [uraian, rekomendasi] = susunLaporanPresisi(indikator, suratDipilih, totalSkor);

    // Tampilkan data siswa
    document.getElementById('dataSiswaPrint').innerHTML = `
        <div style="background:#f9fbe7; padding:15px; border-radius:8px; margin-bottom:15px;">
            <h3 style="margin:0;">Hasil Membaca Surat ${suratDipilih}</h3>
            <p>Nama: <strong>${namaSiswa}</strong> | Kelas: <strong>${kelasSiswa}</strong> | Tanggal: ${new Date().toLocaleDateString('id-ID')}</p>
        </div>`;
    document.getElementById('kotakHasil').innerHTML = uraian;
    document.getElementById('kotakRekomendasi').innerHTML = rekomendasi;
}

// Periksa hukum tajwid yang muncul di surat terpilih
function periksaHukumBerdasarkanSurat(namaSurat) {
    // Setiap hukum dinilai: 0=keliru, 1=kurang, 2=benar
    let h = {
        ikhfa: 1, idgham: 1, iqlab: 0, izhar: 2,
        ikhfaSyafawi: 2, idghamMimi: 1, izharSyafawi: 2,
        madThabii: 1, madFar'i: 0, alSyamsiyah: 1, alQamariyah: 1
    };

    // Sesuaikan pemeriksaan dengan isi surat yang dibaca
    if(namaSurat === "Al-Fatihah") {
        h = {
            izhar: 2, ikhfa: 1, idgham: 1, iqlab: 0,
            madThabii: 1, madFar'i: 0,
            alSyamsiyah: 1, alQamariyah: 2,
            ghunnah: 2, qalqalah: 1
        };
    } else if(namaSurat === "Al-Ikhlas") {
        h = {
            izhar: 2, madThabii: 1, madFar'i: 0,
            alQamariyah: 2, ghunnah: 2,
            hurufLambang: 1
        };
    } else if(namaSurat === "Al-Falaq" || namaSurat === "An-Nas") {
        h = {
            izhar: 2, ikhfa: 1,
            madThabii: 1, madFar'i: 0,
            alSyamsiyah: 1, alQamariyah: 2,
            ghunnah: 2
        };
    }

    // Tambahkan variasi agar tidak selalu sama
    let kunci = Object.keys(h);
    kunci.forEach(k => {
        if(Math.random() < 0.25) h[k] = Math.max(0, h[k]-1);
        else if(Math.random() < 0.35) h[k] = Math.min(2, h[k]+1);
    });
    return h;
}

function hitungSkorTotal(indikator) {
    let nilai = Object.values(indikator);
    let maks = nilai.length * 2;
    let total = nilai.reduce((a,b)=>a+b,0);
    return Math.round((total/maks)*100);
}

function susunLaporanPresisi(h, surat, skor) {
    let uraian = `<div class="nilai-besar">${skor}/100</div><hr>`;
    let rincian = [];
    let butuhLatihan = [];

    // Fungsi bantu tampilkan status
    let status = v => v===2 ? `<span class="benar">✅ BENAR</span>` : v===1 ? `<span class="perlu-perbaikan">⚠️ KURANG TEPAT</span>` : `<span class="salah">❌ KELIRU</span>`;
    let catatan = v => v===2 ? "Dibaca sesuai kaidah" : v===1 ? "Belum konsisten, kadang panjang/kadang pendek" : "Belum dibaca sesuai hukumnya";

    // Daftar hukum yang diperiksa
    let daftar = {
        izhar:     ["Izhar Halqi", "Nun mati/tanwin dibaca jelas, TIDAK disamarkan"],
        ikhfa:     ["Ikhfa Haqiqi", "Nun mati/tanwin disamarkan dengan mendengung"],
        idgham:    ["Idgham Bighunnah/Bilaghunnah", "Dilebur ke huruf berikutnya"],
        iqlab:     ["Iqlab", "Berubah menjadi bunyi Mim"],
        izharSyafawi: ["Izhar Syafawi", "Mim mati dibaca jelas"],
        ikhfaSyafawi: ["Ikhfa Syafawi", "Mim mati disamarkan"],
        idghamMimi:  ["Idgham Mimi", "Mim mati dilebur ke Mim berikutnya"],
        madThabii:   ["Mad Thabi'i", "Panjang 2 harakat — tidak boleh kurang/lebih"],
        madFar'i:    ["Mad Far'i (Mad Wajib, Jaiz, 'Arid, dll)", "Panjang 4–5 atau 6 harakat sesuai jenisnya"],
        alSyamsiyah: ["Alif Lam Syamsiyah", "Lam TIDAK dibaca, langsung masuk huruf berikutnya"],
        alQamariyah: ["Alif Lam Qamariyah", "Lam dibaca JELAS"],
        ghunnah:     ["Ghunnah", "Dengung pada huruf Nun/Mim bertasydid"],
        qalqalah:    ["Qalqalah", "Pantulan huruf Qalqalah"],
        hurufLambang: ["Pengucapan Huruf", "Tempat keluar huruf & sifatnya"]
    };

    for(let k in h) {
        if(!daftar[k]) continue;
        rincian.push(`<div class="bagian"><strong>${daftar[k][0]}</strong>: ${status(h[k])}<br><small>${daftar[k][1]}</small> — ${catatan(h[k])}</div>`);
        if(h[k] < 2) butuhLatihan.push(daftar[k][0]);
    }

    uraian += rincian.join("");

    // === REKOMENDASI PELATIHAN BERDASARKAN KESALAHAN ===
    let rekom = `<strong>📖 Rekomendasi Latihan Khusus:</strong><br><br>`;
    if(skor >= 90) {
        rekom += `✅ Bacaan sudah SANGAT BAIK. Pertahankan! Lanjut ke surat berikutnya dan perbanyak hafalan.`;
    } else if(skor >= 75) {
        rekom += `⚠️ Bacaan sudah BAIK, namun masih perlu perbaikan pada:<br>`;
        butuhLatihan.forEach(r => rekom += `&nbsp;&nbsp;🔹 ${r}<br>`);
        rekom += `<br>📌 Saran: Latih bagian di atas secara khusus, perhatikan panjang pendek Mad dan kejelasan Nun/Mim mati.`;
    } else {
        rekom += `❌ Perlu PERBAIKAN SERIUS pada:<br>`;
        butuhLatihan.forEach(r => rekom += `&nbsp;&nbsp;🔴 ${r}<br>`);
        rekom += `<br>📌 Saran: Pelajari kembali hukum-hukum di atas satu per satu. Mulai dari Izhar, Ikhfa, Idgham, Iqlab. Latih perlahan, perhatikan kejelasan huruf dan panjang Mad. Minta guru membimbing secara langsung.`;
    }

    return [uraian, rekom];
}

function ulangi() { location.reload(); }
</script>
</body>
</html>
