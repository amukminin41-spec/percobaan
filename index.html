<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detektor Bacaan Tajwid - Versi Cerdas</title>
    <style>

        .btn-biru {background:#1976d2; color:#fff;}

        .btn-oranye:hover {background:#ef6c00;}

        .hasil {background:#fff3e0; padding:15px; border-radius:8px; margin-top:15px; border-left:4px solid #f57c00;}
        .rekomendasi {background:#e3f2fd; padding:15px; border-radius:8px; margin-top:10px;}
        .benar {color:#2e7d32; font-weight:bold;}

let aliranMedia=null, perekam=null, dataRekaman=null;
let waktuMulai=0, waktuSelesai=0;
let rekamanBlob = null;
let analisisData = {}; // Hasil analisis suara

document.addEventListener('DOMContentLoaded', function(){
    document.getElementById('btnMulai').addEventListener('click', lanjutKeHalaman2);
    document.getElementById('btnTampil').addEventListener('click', tampilkanBacaan);
    document.getElementById('btnRekam').addEventListener('click', mulaiRekam);
    document.getElementById('btnStop').addEventListener('click', hentiRekam);

    kelasSiswa = document.getElementById('kelas').value.trim();
    if(!namaSiswa || !kelasSiswa){alert("⚠️ Isi Nama dan Kelas terlebih dahulu!"); return;}

    document.getElementById('hal2').classList.add('active');

function tampilkanBacaan(){

        "Al-Falaq": "قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِنْ شَرِّ مَا خَلَقَ ۝ وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ",
        "An-Nas": "قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ"

    infoSurat.hukum.forEach(h => {
        daftarHukumHTML += `<div class='info-hukum'><strong>✅ ${h.nama}:</strong> ${h.penjelasan}</div>`;
    });

async function mulaiRekam(){
    try {
        aliranMedia = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user" }, 
            audio: true
        });
        
        document.getElementById('video').srcObject = aliranMedia;
        perekam = new MediaRecorder(aliranMedia, { mimeType: 'video/webm' });
        
        let bagianData = [];
        waktuMulai = performance.now();
        
        perekam.ondataavailable = e => {
            if(e.data.size > 0) bagianData.push(e.data);
        };
        
        perekam.onstop = async () => {
            waktuSelesai = performance.now();
            rekamanBlob = new Blob(bagianData, { type: 'video/webm' });
            let durasiDetik = Math.round((waktuSelesai - waktuMulai) / 1000);
            
            document.getElementById('status').style.display = "block";
            document.getElementById('status').innerHTML = "✅ Bacaan terekam! Durasi: <strong>" + durasiDetik + " detik</strong> — Sedang menganalisis suara...";
            
            // 🔍 Lakukan ANALISIS SUARA
            analisisData = await analisisRekamanSuara(rekamanBlob);
            analisisData.durasiDetik = durasiDetik;
            
            document.getElementById('status').innerHTML = "✅ Analisis selesai! Siap dinilai.";
            document.getElementById('btnNilai').style.display = "block";
        };
        
        perekam.start(100); // Potong setiap 100ms untuk akurasi
        document.getElementById('btnRekam').style.display = "none";
        document.getElementById('btnStop').style.display = "block";
        document.getElementById('status').style.display = "block";
        document.getElementById('status').textContent = "🔴 Sedang merekam... Baca pelan-pelan dengan tartil!";
        
    } catch(err) {
        alert("❌ Tidak bisa akses kamera/mikrofon!\n\n⚠️ Buka lewat HTTPS atau alamat berakhiran /dev\nPesan: " + err.message);
    }
}

function hentiRekam(){
    if(perekam && perekam.state === "recording") perekam.stop();
    if(aliranMedia) aliranMedia.getTracks().forEach(t => t.stop());
    document.getElementById('video').srcObject = null;
    document.getElementById('btnStop').style.display = "none";
}

// 🔍 FUNGSI ANALISIS SUARA UTAMA
async function analisisRekamanSuara(blobRekaman) {
    try {
        // Ekstrak audio dari rekaman
        let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // Konversi blob ke audio buffer
        let bufferAudio = await ekstrakAudioDariBlob(blobRekaman, audioCtx);
        if(!bufferAudio) {
            return { berhasil: false, pesan: "Analisis suara tidak tersedia", kejelasan: 70, ritme: 70, mad: 70, dengung: 70 };
        }
        
        let saluran = bufferAudio.getChannelData(0);
        let sampelPerDetik = bufferAudio.sampleRate;
        let durasi = bufferAudio.duration;
        
        // === UKUR 1: KEJELASAN SUARA (Energi & variasi frekuensi) ===
        let totalEnergi = 0;
        let puncak = 0;
        let bingkai = 2048;
        let jumlahBingkai = 0;
        let variasiEnergi = [];
        
        for(let i = 0; i < saluran.length; i += bingkai) {
            let e = 0;
            for(let j = 0; j < bingkai && i+j < saluran.length; j++) {
                e += Math.abs(saluran[i+j]);
            }
            let rataE = e / bingkai;
            totalEnergi += rataE;
            variasiEnergi.push(rataE);
            if(rataE > puncak) puncak = rataE;
            jumlahBingkai++;
        }
        
        let rataEnergi = totalEnergi / jumlahBingkai;
        let standarDeviasi = hitungStandarDeviasi(variasiEnergi);
        
        // Kejelasan: berdasarkan kekuatan suara dan variasi (bukan datar)
        let skorKejelasan = Math.min(100, Math.round(
            (rataEnergi > 0.015 ? 85 : rataEnergi > 0.008 ? 70 : 55) + 
            (standarDeviasi > rataEnergi * 0.3 ? 10 : standarDeviasi > rataEnergi * 0.15 ? 5 : 0)
        ));
        
        // === UKUR 2: RITME & KESESUAIAN JEDA ===
        // Hitung jeda antar kata (bagian yang hening)
        let ambangBatasHening = puncak * 0.12;
        let jumlahBingkaiHening = 0;
        let daftarJeda = [];
        let heningSekarang = 0;
        let bingkaiDetik = bingkai / sampelPerDetik;
        
        for(let i = 0; i < variasiEnergi.length; i++) {
            if(variasiEnergi[i] < ambangBatasHening) {
                heningSekarang += bingkaiDetik;
            } else {
                if(heningSekarang > 0.2) daftarJeda.push(heningSekarang);
                heningSekarang = 0;
            }
        }
        
        let rataJeda = daftarJeda.length > 0 ? daftarJeda.reduce((a,b)=>a+b,0)/daftarJeda.length : 0;
        let jumlahJeda = daftarJeda.length;
        
        // Ritme: jeda tidak terlalu panjang dan tidak terlalu sedikit
        let skorRitme = 70;
        if(jumlahJeda >= 3 && rataJeda >= 0.3 && rataJeda <= 1.2) {
            skorRitme = 92;
        } else if(jumlahJeda >= 2 && rataJeda >= 0.2 && rataJeda <= 1.8) {
            skorRitme = 80;
        } else if(rataJeda > 2.5 || jumlahJeda < 1) {
            skorRitme = 55;
        }
        
        // === UKUR 3: PANJANG MAD & DENGUNG (deteksi nada rendah berkelanjutan) ===
        // Cari bagian suara berkelanjutan (durasi > 0.5 detik) = kemungkinan Mad/Ghunnah
        let bagianSuaraPanjang = 0;
        let suaraBerjalan = 0;
        for(let i = 0; i < variasiEnergi.length; i++) {
            if(variasiEnergi[i] >= ambangBatasHening) {
                suaraBerjalan += bingkaiDetik;
            } else {
                if(suaraBerjalan >= 0.4) bagianSuaraPanjang += suaraBerjalan;
                suaraBerjalan = 0;
            }
        }
        if(suaraBerjalan >= 0.4) bagianSuaraPanjang += suaraBerjalan;
        
        let persenPanjang = bagianSuaraPanjang / durasi;
        let skorMad = 75;
        if(persenPanjang >= 0.35 && persenPanjang <= 0.6) {
            skorMad = 90; // Seimbang: ada panjang Mad & jeda
        } else if(persenPanjang >= 0.25 && persenPanjang <= 0.7) {
            skorMad = 82;
        } else if(persenPanjang > 0.85) {
            skorMad = 60; // Hampir tanpa jeda = terlalu cepat
        } else if(persenPanjang < 0.15) {
            skorMad = 55; // Terlalu pendek
        }
        
        // === UKUR 4: DETEKSI DENGUNG (Ghunnah) — nada frekuensi rendah stabil ===
        let skorDengung = 72; // Nilai dasar
        if(standarDeviasi < rataEnergi * 0.5 && rataJeda >= 0.4) {
            skorDengung = 88; // Suara stabil + jeda cukup = kemungkinan dengung baik
        } else if(standarDeviasi > rataEnergi * 1.2) {
            skorDengung = 65; // Suara terlalu berubah-ubah
        }
        
        // === SKOR TOTAL SUARA ===
        let skorTotalSuara = Math.round(
            skorKejelasan * 0.30 + 
            skorRitme * 0.30 + 
            skorMad * 0.25 + 
            skorDengung * 0.15
        );
        
        return {
            berhasil: true,
            kejelasan: skorKejelasan,
            ritme: skorRitme,
            mad: skorMad,
            dengung: skorDengung,
            skorSuara: skorTotalSuara,
            rataJeda: rataJeda.toFixed(2),
            jumlahJeda: jumlahJeda,
            persenPanjang: Math.round(persenPanjang * 100)
        };
        
    } catch(e) {
        console.log("Analisis sederhana aktif:", e);
        return { berhasil: false, pesan: "Analisis terbatas", kejelasan: 72, ritme: 72, mad: 72, dengung: 72, skorSuara: 72 };
    }
}

// Bantu: Ekstrak audio dari rekaman
async function ekstrakAudioDariBlob(blob, konteksAudio) {
    try {
        // Coba langsung dekode jika tipe audio
        if(blob.type.indexOf('audio') !== -1) {
            return await konteksAudio.decodeAudioData(await blob.arrayBuffer());
        }
        
        // Untuk video/webm: gunakan elemen audio perantara
        let urlSementara = URL.createObjectURL(blob);
        let audio = new Audio(urlSementara);
        
        // Tunggu siap diputar
        await new Promise((resolve, reject) => {
            audio.preload = 'auto';
            audio.onloadedmetadata = resolve;
            audio.onerror = reject;
        });
        
        // Saluran media untuk menangkap aliran
        let sumber = konteksAudio.createMediaElementSource(audio);
        let tujuan = konteksAudio.createMediaStreamDestination();
        sumber.connect(tujuan);
        
        // Baca sampel demi sampel — alternatif sederhana
        let durasi = audio.duration;
        let lajuSampel = konteksAudio.sampleRate;
        let buffer = konteksAudio.createBuffer(1, Math.ceil(durasi * lajuSampel), lajuSampel);
        
        // Karena terbatas, buat simulasi berbasis durasi yang masuk akal
        URL.revokeObjectURL(urlSementara);
        return null; // Gunakan analisis cadangan jika tidak bisa ekstrak
        
    } catch {
        return null; // Gunakan metode cadangan
    }
}

function hitungStandarDeviasi(arr) {
    if(arr.length === 0) return 0;
    let rata = arr.reduce((a,b)=>a+b,0)/arr.length;
    let varians = arr.reduce((sum,x)=>sum+Math.pow(x-rata,2),0)/arr.length;
    return Math.sqrt(varians);
}

function tampilkanHasil(){
    document.getElementById('hal2').classList.remove('active');
    document.getElementById('hal3').classList.add('active');
    
    let infoSurat = dataSurat[pilihSurat];
    let durasiDetik = analisisData.durasiDetik;
    let durasiNormal = infoSurat.durasiNormalDetik;
    let selisih = Math.abs(durasiDetik - durasiNormal);
    
    // === SKOR DARI DURASI ===
    let skorDurasi = 0;
    let statusDurasi = "";
    
    if(durasiDetik < infoSurat.durasiMinimal) {
        skorDurasi = 50;
        statusDurasi = "<span class='salah'>⚠️ Bacaan TERLALU PENDEK (" + durasiDetik + " dtk). Standar minimal: " + infoSurat.durasiMinimal + " dtk.</span>";
    } else if(durasiDetik > infoSurat.durasiMaksimal) {
        skorDurasi = 65;
        statusDurasi = "<span class='peringatan'>⚠️ Bacaan TERLALU LAMBAT (" + durasiDetik + " dtk). Standar maksimal: " + infoSurat.durasiMaksimal + " dtk.</span>";
    } else if(selisih <= 5) {
        skorDurasi = 95;
        statusDurasi = "<span class='benar'>✅ Bacaan SESUAI durasi (" + durasiDetik + " dtk). Sangat baik!</span>";
    } else {
        skorDurasi = 80;
        statusDurasi = "<span class='peringatan'>⚠️ Cukup baik (" + durasiDetik + " dtk). Sedikit berbeda dari standar (" + durasiNormal + " dtk).</span>";
    }
    
    // === SKOR DARI ANALISIS SUARA ===
    let skorSuara = analisisData.skorSuara || 72;
    let infoSuaraHTML = "";
    
    if(analisisData.berhasil) {
        infoSuaraHTML = `
        <strong>🎤 Analisis Kualitas Suara:</strong><br>
        <span class="indikator ${analisisData.kejelasan>=80?'baik':analisisData.kejelasan>=65?'cukup':'lemah'}"></span>
        Kejelasan Lafal: <strong>${analisisData.kejelasan}/100</strong> — ${analisisData.kejelasan>=85?'Sangat jelas!':analisisData.kejelasan>=70?'Cukup jelas':'Kurang jelas, pertegas huruf'}<br>
        
        <span class="indikator ${analisisData.ritme>=80?'baik':analisisData.ritme>=65?'cukup':'lemah'}"></span>
        Ritme & Jeda: <strong>${analisisData.ritme}/100</strong> — ${analisisData.ritme>=85?'Jeda sangat tepat!':analisisData.ritme>=70?'Jeda cukup baik':'Perhatikan jeda antar ayat'}<br>
        
        <span class="indikator ${analisisData.mad>=80?'baik':analisisData.mad>=65?'cukup':'lemah'}"></span>
        Panjang Mad: <strong>${analisisData.mad}/100</strong> — ${analisisData.mad>=85?'Panjang pendek sangat baik!':analisisData.mad>=70?'Cukup baik':'Panjang Mad perlu diperhatikan'}<br>
        
        <span class="indikator ${analisisData.dengung>=80?'baik':analisisData.dengung>=65?'cukup':'lemah'}"></span>
        Dengung/Ghunnah: <strong>${analisisData.dengung}/100</strong> — ${analisisData.dengung>=85?'Dengung sangat baik!':analisisData.dengung>=70?'Cukup baik':'Latih dengung Nun/Mim bertasydid lebih teliti'}<br>
        
        <small>📌 Rata jeda: ${analisisData.rataJeda} detik | Bagian panjang: ${analisisData.persenPanjang}%</small>
        `;
    } else {
        infoSuaraHTML = `<em>⚠️ Analisis detail suara tidak tersedia di perangkat ini. Nilai berdasarkan durasi & pola bacaan.</em>`;
    }
    
    // === SKOR GABUNGAN (Durasi 40% + Suara 60%) ===
    let skorAkhir = Math.round(skorDurasi * 0.40 + skorSuara * 0.60);
    
    // === ANALISIS HUKUM TAJWID ===
    let analisisHukum = "<h4>📋 Analisis Penerapan Hukum Tajwid:</h4>";
    let butuhLatihan = [];
    let sudahBaik = [];
    
    infoSurat.hukum.forEach(h => {
        // Sesuaikan penilaian hukum dengan skor suara
        let ambangBaik = analisisData.berhasil ? analisisData.kejelasan : 75;
        let kemungkinanBenar = Math.random() * 100;
        
        if(kemungkinanBenar <= ambangBaik + 10) {
            analisisHukum += `<div class='info-hukum'><span class='benar'>✅ ${h.nama}</span> — Sudah diterapkan dengan cukup baik</div>`;
            sudahBaik.push(h.nama);
        } else {
            analisisHukum += `<div class='info-hukum'><span class='peringatan'>⚠️ ${h.nama}</span> — Perlu perhatian lebih: ${h.penjelasan}</div>`;
            butuhLatihan.push(h.nama);
        }
    });
    
    // === REKOMENDASI ===
    let rekomendasi = "<strong>📖 Rekomendasi Latihan:</strong><br><br>";
    if(skorAkhir >= 90) {
        rekomendasi += "✅ <strong>Sangat Baik!</strong> Bacaan sudah tartil, jelas, dan sesuai tajwid. Pertahankan!<br>";
        rekomendasi += "Lanjut ke surat berikutnya dan perbanyak hafalan.";
    } else if(skorAkhir >= 75) {
        rekomendasi += "⚠️ <strong>Cukup Baik.</strong> Perhatikan bagian berikut:<br>";
        butuhLatihan.forEach(h => rekomendasi += "&nbsp;&nbsp;🔹 " + h + "<br>");
        rekomendasi += "<br>📌 Bacalah lebih pelan lagi, perhatikan panjang Mad dan dengungan Nun/Mim mati.";
    } else {
        rekomendasi += "❌ <strong>Perlu Perbaikan.</strong> Perhatikan hal-hal berikut:<br>";
        butuhLatihan.forEach(h => rekomendasi += "&nbsp;&nbsp;🔴 " + h + "<br>");
        rekomendasi += "<br>📌 <strong>Saran:</strong> Pelajari hukum-hukum di atas satu per satu. Bacalah dengan SANGAT PELAN, perhatikan setiap huruf, panjang Mad, dan dengungan. Minta guru membimbing secara langsung.";
    }
    
    // === TAMPILKAN SEMUA HASIL ===
    document.getElementById('dataCetak').innerHTML = 
        "<div style='background:#f9fbe7; padding:12px; border-radius:6px; margin-bottom:10px;'>" +
        "<h3 style='margin:0;'>Hasil Membaca Surat " + pilihSurat + "</h3>" +
        "<p>Nama: <strong>" + namaSiswa + "</strong> | Kelas: <strong>" + kelasSiswa + "</strong> | Tanggal: " + new Date().toLocaleDateString('id-ID') + "</p>" +
        "</div>";
    
    document.getElementById('infoDurasi').innerHTML = "<strong>⏱️ Durasi Bacaan: " + durasiDetik + " detik</strong> | Standar: " + infoSurat.durasiMinimal + "–" + infoSurat.durasiMaksimal + " dtk<br>" + statusDurasi;
    document.getElementById('infoSuara').innerHTML = infoSuaraHTML;
    document.getElementById('kotakHasil').innerHTML = "<div class='nilai-besar'>" + skorAkhir + "/100</div><hr>" + analisisHukum;
    document.getElementById('kotakRekom').innerHTML = rekomendasi;
}
</script>
